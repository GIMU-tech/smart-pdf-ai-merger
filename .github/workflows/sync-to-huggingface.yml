name: Sync to Hugging Face hub
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  sync-to-hub:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true
      - name: Push to hub
        run: |
          git remote add hf https://KOOHAWN:${{ secrets.HF_TOKEN }}@huggingface.co/spaces/KOOHAWN/AI_PDF_TOOLKIt
          git push --force hf main:main
