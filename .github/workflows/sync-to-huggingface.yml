name: Sync to Hugging Face hub
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  sync-to-hub:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true
      - name: Push to hub
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          test -n "$HF_TOKEN"
          git lfs install
          git remote add hf https://KOOHAWN:${HF_TOKEN}@huggingface.co/spaces/KOOHAWN/AI_PDF_TOOLKIt
          git lfs push hf main || true
          git push --force hf main:main
      - name: Factory reboot Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          test -n "$HF_TOKEN"
          python -m pip install -U huggingface_hub
          python - <<'PY'
          import os
          from huggingface_hub import HfApi

          runtime = HfApi().restart_space(
              repo_id="KOOHAWN/AI_PDF_TOOLKIt",
              token=os.environ["HF_TOKEN"],
              factory_reboot=True,
          )
          print(runtime)
          PY
