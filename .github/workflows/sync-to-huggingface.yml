name: Sync to Hugging Face hub
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-to-hub:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true
      - name: Push to hub
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          test -n "$HF_TOKEN"
          python -m pip install -U huggingface_hub
          python - <<'PY'
          import os
          from huggingface_hub import HfApi

          api = HfApi(token=os.environ["HF_TOKEN"])
          api.upload_folder(
              repo_id="KOOHAWN/AI_PDF_TOOLKIt",
              repo_type="space",
              folder_path=".",
              path_in_repo=".",
              commit_message="Sync from GitHub Actions",
              ignore_patterns=[
                  ".git/*",
                  ".github/*",
                  ".env*",
                  "node_modules/*",
                  "dist/*",
                  "build/*",
                  "coverage/*",
                  "release/*",
                  "temp_uploads/*",
                  "bin/gs/*",
                  "bin/mutool.exe",
                  "*.log",
              ],
          )
          PY
      - name: Factory reboot Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          test -n "$HF_TOKEN"
          python -m pip install -U huggingface_hub
          python - <<'PY'
          import os
          from huggingface_hub import HfApi

          api = HfApi()
          runtime = api.restart_space(
              repo_id="KOOHAWN/AI_PDF_TOOLKIt",
              token=os.environ["HF_TOKEN"],
          )
          print(runtime)
      - name: Capture Space logs
        if: always()
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          test -n "$HF_TOKEN"
          python -m pip install -U huggingface_hub
          python - <<'PY'
          import os
          from pathlib import Path
          from huggingface_hub import HfApi

          api = HfApi(token=os.environ["HF_TOKEN"])
          out = Path("docs/hf-space-last-logs.txt")
          out.parent.mkdir(parents=True, exist_ok=True)

          parts = []
          for label, kwargs in [
              ("BUILD LOGS", {"build": True}),
              ("RUNTIME LOGS", {}),
          ]:
              parts.append(f"===== {label} =====\n")
              try:
                  lines = []
                  for idx, line in enumerate(api.fetch_space_logs("KOOHAWN/AI_PDF_TOOLKIt", **kwargs)):
                      lines.append(line)
                      if idx >= 240:
                          break
                  parts.append("".join(lines) or "(no logs returned)\n")
              except Exception as exc:
                  parts.append(f"ERROR: {type(exc).__name__}: {exc}\n")
              parts.append("\n")

          out.write_text("".join(parts), encoding="utf-8")
          PY
      - name: Commit captured Space logs
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/hf-space-last-logs.txt
          git commit -m "chore: capture hf space logs [skip ci]" || exit 0
          git push origin HEAD:main
